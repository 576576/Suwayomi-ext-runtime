name: Publish

# 发布 ext-runtime 到 GitHub Packages + Release 资产：推 v* tag 触发，也可手动 workflow_dispatch。
#
# 版本号 = `<AOSP API level>.<本仓库主版本>.<修订>`，如 `30.1.0`。
# 大版本跟着 android-stub 的公开 API 基线（pin 在 ext-runtime/android-stub/android-stub.properties），
# 与 android-stub 自己的 `30.r03.1` 同一套思路 —— 看一眼版本号就知道它对应哪个 Android API。
# 换 pin 忘改版本号会在「解析版本号」那步直接失败。
#
# 坐标、制品构成、认证与消费方式见 docs/EXTRACTION_RECORD.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v 前缀；大版本须等于 pin 里的 AOSP API level，如 30.1.0）
        required: true
        type: string

permissions:
  contents: write # 创建/更新 GitHub Release 并挂载制品
  packages: write # 推 Maven 包

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # 版本号 = <AOSP API level>.<本仓库主版本>.<修订>。
      # 大版本跟着 android-stub 的公开 API 基线走（同 android-stub 的 `30.r03.1` 那套思路），
      # 所以「这个 ext-runtime 对应哪个 Android API」看一眼版本号就知道。
      # 这里**强制**两者一致：换 pin 忘了改版本号会直接红，不会静默发错。
      - name: 解析版本号
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            V="${REF_NAME#v}"
          else
            V="$INPUT_VERSION"
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号格式非法：$V（应为 <AOSP API level>.<主版本>.<修订>，如 30.1.0）"
            exit 1
          fi

          API="$(sed -n 's/^aospApiLevel=//p' ext-runtime/android-stub/android-stub.properties)"
          test -n "$API" || { echo "::error::读不到 aospApiLevel"; exit 1; }
          if [ "${V%%.*}" != "$API" ]; then
            echo "::error::版本号大版本必须是 AOSP API level：版本 $V 的大版本是 ${V%%.*}，而 pin 里是 $API"
            echo "          改 pin 就要同时改版本号（见 ext-runtime/android-stub/android-stub.properties 尾部说明）"
            exit 1
          fi

          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "aosp_api_level=$API" >> "$GITHUB_OUTPUT"
          echo "发布版本：$V（对应 Android API $API）"

      - name: 构建
        run: ./gradlew --no-daemon --console=plain build

      # 制品不变量。AOSP 基线一旦要升级，这里必须同步改 —— 有意为之。
      - name: 校验制品
        run: |
          set -euo pipefail
          LIB=ext-runtime/build/libs
          test -f "$LIB/ext-runtime.jar"
          test -f "$LIB/ext-runtime-shared-sources.jar"

          echo "--- android-stub 基线（应为 30.r03.1）---"
          unzip -p "$LIB/ext-runtime.jar" META-INF/android-stub.properties | tee /tmp/stub.properties
          grep -q '^version=30\.r03\.1$' /tmp/stub.properties \
            || { echo "::error::AOSP 基线与预期不一致"; exit 1; }

          echo "--- 共享源码树制品内容 ---"
          unzip -l "$LIB/ext-runtime-shared-sources.jar" | head -20
          unzip -l "$LIB/ext-runtime-shared-sources.jar" | grep -q 'eu/kanade/tachiyomi/' \
            || { echo "::error::shared-sources 制品缺少 eu/kanade/tachiyomi/**"; exit 1; }
          unzip -l "$LIB/ext-runtime-shared-sources.jar" | grep -q 'suwayomi/tachidesk/' \
            || { echo "::error::shared-sources 制品缺少 suwayomi/tachidesk/**"; exit 1; }

      - name: 发布到 GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon --console=plain publish \
            -PextRuntimeVersion="${{ steps.ver.outputs.version }}"

      - name: 生成校验和
        run: |
          set -euo pipefail
          LIB=ext-runtime/build/libs
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp "$LIB/ext-runtime.jar"                "dist/ext-runtime-$V.jar"
          cp "$LIB/ext-runtime-shared-sources.jar" "dist/ext-runtime-$V-shared-sources.jar"
          ( cd dist && sha256sum "ext-runtime-$V.jar" "ext-runtime-$V-shared-sources.jar" \
              > "ext-runtime-$V.sha256" )
          cat "dist/ext-runtime-$V.sha256"

      - name: 挂载到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" --title "v$V" --generate-notes
          fi
          gh release upload "v$V" dist/* --clobber

      - name: 小结
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "### 已发布 \`$V\`"
            echo
            echo '**GitHub Packages**（Gradle 依赖解析，跨仓库需 PAT classic + `read:packages`）'
            echo '```kotlin'
            echo 'repositories {'
            echo '    maven {'
            echo '        url = uri("https://maven.pkg.github.com/576576/Suwayomi-ext-runtime")'
            echo '        credentials {'
            echo '            username = providers.gradleProperty("gpr.user").orNull ?: System.getenv("GITHUB_ACTOR")'
            echo '            password = providers.gradleProperty("gpr.token").orNull ?: System.getenv("EXT_RUNTIME_TOKEN")'
            echo '        }'
            echo '    }'
            echo '}'
            echo 'dependencies {'
            echo "    implementation(\"com.github.576576.suwayomi-ext-runtime:ext-runtime:$V\")"
            echo '}'
            echo '```'
            echo
            echo '**Release 资产**（免鉴权，直接 curl）'
            echo '```bash'
            echo "curl -fLO ${{ github.server_url }}/${{ github.repository }}/releases/download/v$V/ext-runtime-$V.jar"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 裁剪 JRE：**必须原生 runner**，jlink 不能跨平台生成镜像（详见 scripts/make-jre.sh）。
  # 六个 (os, arch) 各一份资产，消费方按 <V>+<os>+<arch> 直接下载。
  jre:
    name: 裁剪 JRE（${{ matrix.jre_os }}-${{ matrix.jre_arch }}）
    needs: publish
    permissions:
      contents: write # 往 publish 建好的那个 Release 里挂资产
    strategy:
      fail-fast: false # 一个平台挂掉不该拖累其余五个
      matrix:
        include:
          - { jre_os: windows, jre_arch: x64,     os: windows-latest,   jdk: temurin }
          # 只有这一格用 zulu：Adoptium 对 windows/aarch64 没发 JDK 25 的任何制品
          # （jdk/jre/jmods 全 404），而 Zulu 的归档自带 jmods/。见 make-jre.sh 头注释。
          - { jre_os: windows, jre_arch: aarch64, os: windows-11-arm,   jdk: zulu    }
          - { jre_os: linux,   jre_arch: x64,     os: ubuntu-latest,    jdk: temurin }
          - { jre_os: linux,   jre_arch: aarch64, os: ubuntu-24.04-arm, jdk: temurin }
          - { jre_os: mac,     jre_arch: x64,     os: macos-15-intel,   jdk: temurin }
          - { jre_os: mac,     jre_arch: aarch64, os: macos-15,         jdk: temurin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.jdk }}
          java-version: '25'

      - name: 裁剪 JRE
        shell: bash
        run: bash scripts/make-jre.sh "${{ matrix.jre_os }}" "${{ matrix.jre_arch }}" out/jre

      - name: 冒烟并打包
        shell: bash
        env:
          JRE_OS: ${{ matrix.jre_os }}
          JRE_ARCH: ${{ matrix.jre_arch }}
          V: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          # Windows 的启动器带 .exe 后缀，其余不带
          if [ "$JRE_OS" = "windows" ]; then JAVA=out/jre/bin/java.exe; else JAVA=out/jre/bin/java; fi
          test -f "$JAVA" || { echo "::error::产出的 JRE 缺 $JAVA"; ls -R out/jre | head -30; exit 1; }
          test -f out/jre/release || { echo "::error::产出的 JRE 缺 release 文件"; exit 1; }

          # 真跑一次：magic/架构自检在 make-jre.sh 里已经做了，这里验它**能起来**
          "$JAVA" -version

          ASSET="ext-runtime-jre-$V-$JRE_OS-$JRE_ARCH.tar.gz"
          # 归档里把 jre/ 放在根：消费方 `tar -xzf <资产> -C <stage>` 直接得到 <stage>/jre
          tar -czf "$ASSET" -C out jre
          echo "asset=$ASSET" >> "$GITHUB_ENV"
          ls -la "$ASSET"

      - name: 挂载到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.publish.outputs.version }}
        run: gh release upload "v$V" "$ASSET" --clobber
