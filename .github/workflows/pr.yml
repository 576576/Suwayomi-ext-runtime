name: PR

# PR 阶段的把关：只做「能不能构建 + 制品不变量」，不发布、不出 JRE、不碰 GitHub Packages。
#
# 为什么不直接给 build.yml 加 pull_request：build.yml 是 workflow_call 复用的**发布链**，
# 它的 inputs（version_name / version_code / jre_targets …）在 PR 场景下没有值 —— 混在一起
# 要么给必填项编默认值、要么到处补 if，很容易把发布路径改坏。拆成独立文件更安全，也让
# 「PR 只验证、main 才发布」这件事在文件名上就看得见。
#
# 制品口径与发布链完全一致：共用 scripts/verify-artifacts.sh，避免两份清单各自漂移。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一 PR 连推多次时取消上一次 —— 旧结果没有意义，还占 runner。
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建与制品不变量
    runs-on: ubuntu-latest
    permissions:
      contents: read # PR 只需要读仓库：不推包、不发 Release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建
        run: ./gradlew --no-daemon --console=plain build

      - name: 校验制品
        run: bash scripts/verify-artifacts.sh
