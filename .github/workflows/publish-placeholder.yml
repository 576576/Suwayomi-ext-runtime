name: Publish placeholder

# 一次性引导用：在 GitHub Packages 上把坐标
#   com.github.576576.suwayomi-ext-runtime:ext-runtime
# 占出来，供主仓库 Suwayomi-next 在
#   Package settings → Manage Actions access
# 里授权 Read（否则它的 GITHUB_TOKEN 拉不到这个 package）。
#
# 真实的发布流水线是 P3 之后新增的 publish.yml（从 ext-runtime/ 模块构建真制品）；
# 本文件届时删除。
#
# 认证：GitHub Packages 的 Maven 注册表**只认 PAT (classic)** 或 Actions 里的 GITHUB_TOKEN，
# 所以占位必须从 Actions 发 —— 本地没有 write:packages 凭据。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 占位版本号
        required: true
        default: 0.0.0-placeholder

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 发布占位制品
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/ph"
          mkdir -p "$D"

          cat > "$D/settings.gradle.kts" <<'EOF'
          rootProject.name = "placeholder"
          EOF

          cat > "$D/build.gradle.kts" <<'EOF'
          plugins {
              `java`
              `maven-publish`
          }

          group = "com.github.576576.suwayomi-ext-runtime"
          version = providers.gradleProperty("phVersion").get()

          // 占位制品：一个带说明文件的空 jar。两个制品名与真实发布的形态一致
          // （主制品 + classifier=shared-sources 的共享源码），这样授权一次即可。
          val placeholderFile = layout.buildDirectory.file("placeholder/PLACEHOLDER.txt")
          val genPlaceholder by tasks.registering {
              outputs.file(placeholderFile)
              doLast {
                  val f = placeholderFile.get().asFile
                  f.parentFile.mkdirs()
                  f.writeText("placeholder artifact - 真实制品由 Suwayomi-ext-runtime 的 publish.yml 产出\n")
              }
          }

          tasks.jar {
              from(genPlaceholder) { into("META-INF") }
          }

          publishing {
              publications {
                  create<MavenPublication>("extRuntime") {
                      artifactId = "ext-runtime"
                      artifact(tasks.named("jar"))
                      artifact(tasks.named("jar")) { classifier = "shared-sources" }
                  }
              }
              repositories {
                  maven {
                      name = "GitHubPackages"
                      url = uri("https://maven.pkg.github.com/576576/Suwayomi-ext-runtime")
                      credentials {
                          username = System.getenv("GITHUB_ACTOR") ?: "x-access-token"
                          password = System.getenv("GITHUB_TOKEN")
                      }
                  }
              }
          }
          EOF

          ./gradlew -p "$D" --no-daemon --stacktrace publish -PphVersion="$VERSION"

      - name: 回显坐标
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "已发布："
          echo "  com.github.576576.suwayomi-ext-runtime:ext-runtime:$VERSION"
          echo "  https://github.com/576576/Suwayomi-ext-runtime/pkgs/maven/ext-runtime"
