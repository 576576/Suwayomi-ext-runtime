# 公开 API 基线（AOSP target）。构建 android-stub 时按这份 pin 下载并剥离。
#
# 来源取 dl.google.com 的 SDK platform 包，不用参考实现 getAndroid.sh 里的
# android.googlesource.com —— 后者在部分网络下不可达（本项目开发机就是）。
# 两者的公开 API 基线一致：platform-30_r03 剥离后与参考实现 com.github.Suwayomi:android-jar:1.0.0
# 的类集合完全相同，3093/3101 个类逐字节 CRC 相同，其余 8 个是 android/net/wifi 与
# androidx/annotation 下的签名微调。
#
# 文件名 platform-<api>_r<修订>.zip 不可变：官方改包会换新文件名，不会原地覆盖同名文件。
aospApiLevel=36
aospPlatformPackageRevision=r02
aospPlatformPackageSha256=37607369a28c5b640b3a7998868d45898ebcb777565a0e85f9acf36f29631d2e
aospPlatformJarSha256=d9eb9da824d9e247a352f570f01e1169e725b2954bca9e283a71786c59b59f9a

# 参考实现 prebuilts/sdk 上对应的公开 API 基线，仅作溯源记录，不参与下载。
# API 36 的对应 commit 尚未取到（android.googlesource.com 在开发机不可达），取到后补。
aospPrebuiltsCommit=TBD

# android-compat 增删 android.*/androidx.* 实现时 +1：剥离集合随之改变，产物内容也变。
stripRevision=1

# 换基线：改 aospApiLevel 与 aospPlatformPackageRevision，更新两个 sha256（前者 sha256sum 下载到的
# zip，后者取包内 android-<版本>/android.jar 的 sha256），再换掉 aospPrebuiltsCommit。
# 换 API level 时 stripRevision 归 1，版本号因此能从 30.r03.x 走到 36.r01.1。
